      function buildCardInnerHtml(name, photoUrl, email, phone, socials){
        var photo = photoUrl
          ? '<img class="biz-card-photo" src="' + photoUrl + '" alt="">'
          : '<div class="biz-card-photo"></div>';

        var rows = [];
        if (email) rows.push('<a class="biz-card-row" href="mailto:' + email + '">' + mailIcon + '<span>' + email + '</span></a>');
        if (phone) rows.push('<a class="biz-card-row" href="tel:' + phone.replace(/[^+\d]/g, '') + '">' + phoneIcon + '<span>' + phone + '</span></a>');
        rows.push('<a class="biz-card-row" href="https://strangemachinelabs.com" target="_blank" rel="noopener">' + globeIcon + '<span>strangemachinelabs.com</span></a>');

        Object.keys(SOCIAL_META).forEach(function (key) {
          var s = socials && socials[key];
          if (s && s.enabled && s.url) {
            rows.push('<a class="biz-card-row" href="' + s.url + '" target="_blank" rel="noopener">' + SOCIAL_META[key].icon + '<span>' + SOCIAL_META[key].label + '</span></a>');
          }
        });

        return (
          '<div class="biz-card-left">' +
            '<div class="biz-card-id">' + photo + '<div class="biz-card-name">' + (name || '') + '</div></div>' +
            '<img class="biz-card-logo" src="https://strangemachinelabs.com/images/logo-strange-machine.png" alt="Strange Machine Labs">' +
          '</div>' +
          '<div class="biz-card-right">' +
            '<div class="biz-card-contact">' + rows.join('') + '</div>' +
            '<div class="biz-card-qr">' + QR_SVG + '</div>' +
          '</div>'
        );
      }

      function cardBtnStyle(primary){
        return {
          fontFamily: "'Space Grotesk',sans-serif",
          fontSize: '13px',
          fontWeight: 500,
          borderRadius: '8px',
          border: '2px solid ' + (primary ? '#39ff88' : '#2a3136'),
          background: '#14171a',
          color: primary ? '#39ff88' : '#e8ebed',
          padding: '9px 14px',
          cursor: 'pointer'
        };
      }

      var CardPreview = createClass({
        componentDidMount: function () {
          var doc = this.props.document;
          if (doc && !doc.getElementById('h2c-script')) {
            var s = doc.createElement('script');
            s.id = 'h2c-script';
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            (doc.head || doc.body).appendChild(s);
          }
        },
        handlePrint: function () {
          this.props.window.print();
        },
        handleDownload: function (format) {
          var win = this.props.window;
          var doc = this.props.document;
          var el = doc.getElementById('cms-card-export');
          var btn = doc.getElementById('cms-' + format + '-btn');
          if (!win.html2canvas || !el) {
            win.alert('Still loading — give it a second and try again.');
            return;
          }
          var original = btn ? btn.textContent : '';
          if (btn) { btn.disabled = true; btn.textContent = 'Rendering…'; }
          win.html2canvas(el, { scale: 3.125, backgroundColor: '#14171a', useCORS: true }).then(function (canvas) {
            var mime = format === 'png' ? 'image/png' : 'image/jpeg';
            var quality = format === 'png' ? undefined : 0.95;
            canvas.toBlob(function (blob) {
              var url = win.URL.createObjectURL(blob);
              var a = doc.createElement('a');
              a.href = url;
              a.download = 'strange-machine-labs-business-card.' + format;
              doc.body.appendChild(a);
              a.click();
              doc.body.removeChild(a);
              win.URL.revokeObjectURL(url);
              if (btn) { btn.disabled = false; btn.textContent = original; }
            }, mime, quality);
          }).catch(function (err) {
            win.alert('Could not generate the image: ' + (err && err.message ? err.message : err));
            if (btn) { btn.disabled = false; btn.textContent = original; }
          });
        },
        render: function () {
          var entry = this.props.entry;
          var name = entry.getIn(['data', 'name']) || '';
          var photoPath = entry.getIn(['data', 'photoUrl']) || '';
          var email = entry.getIn(['data', 'email']) || '';
          var phone = entry.getIn(['data', 'phone']) || '';
          var socialsData = entry.getIn(['data', 'socials']);
          var socials = (socialsData && socialsData.toJS) ? socialsData.toJS() : {};

          var photoAsset = photoPath ? this.props.getAsset(photoPath) : null;
          var photoUrl = photoAsset ? photoAsset.url : '';

          var innerHtml = buildCardInnerHtml(name, photoUrl, email, phone, socials);

          return h(
            'div',
            { style: { padding: '24px', background: '#0b0d0f', minHeight: '100%', boxSizing: 'border-box' } },
            h('div', { className: 'biz-card', dangerouslySetInnerHTML: { __html: innerHtml } }),
            h(
              'div',
              { style: { display: 'flex', gap: '10px', marginTop: '18px', flexWrap: 'wrap' } },
              h('button', { id: 'cms-print-btn', onClick: this.handlePrint.bind(this), style: cardBtnStyle(true) }, 'Print / Save as PDF'),
              h('button', { id: 'cms-png-btn', onClick: this.handleDownload.bind(this, 'png'), style: cardBtnStyle(false) }, 'Download PNG'),
              h('button', { id: 'cms-jpg-btn', onClick: this.handleDownload.bind(this, 'jpg'), style: cardBtnStyle(false) }, 'Download JPG')
            ),
            h(
              'p',
              { style: { fontFamily: "'JetBrains Mono',monospace", fontSize: '11px', color: '#8b969c', lineHeight: '1.6', maxWidth: '560px', marginTop: '12px' } },
              'Walgreens-ready 3.625" × 2.125" bleed design (trims to 3.5" × 2"). Print/Save as PDF, or download a 300 DPI PNG/JPG to upload directly — no need to leave this page.'
            ),
            h('div', {
              id: 'cms-card-export',
              className: 'biz-card card-bleed',
              style: { position: 'absolute', left: '-99999px', top: '0px' },
              dangerouslySetInnerHTML: { __html: innerHtml }
            })
          );
        }
      });

      CMS.registerPreviewTemplate('profile', CardPreview);
    </script>
