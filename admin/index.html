<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Steve's Builds — Admin</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      // --- CMS preview pane for the 'Contact info' editor ---
      //
      // This deliberately does NOT render the business card any more.
      //
      // It used to mirror the card here, which meant the card had to render
      // correctly inside Sveltia's preview iframe -- a container whose width
      // this project can neither see nor control, and which is narrower than
      // any real surface the card actually ships on. That environment was the
      // source of a long string of problems (content reading as clipped at
      // the card's edge, a zoom:0.7 hack to compensate, a re-render race that
      // made the card visibly jump scale on load) none of which were bugs in
      // the card itself -- they were artifacts of previewing it somewhere it
      // was never designed to fit.
      //
      // The card now has exactly two real surfaces, both full-width and both
      // driven by the same shared CSS and the same card-layout.json:
      //   * admin/card-layout.html -- adjust, print, download
      //   * the live site's "Click to contact" popup
      // Anything that needs checking is checked there, where what you see is
      // what prints. This pane is just a signpost to the layout tool.
      CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

      var CardPreview = createClass({
        render: function () {
          return h(
            'div',
            { style: { padding: '32px 24px', background: '#0b0d0f', minHeight: '100%', boxSizing: 'border-box' } },
            h(
              'p',
              { style: { fontFamily: "'Space Grotesk',sans-serif", fontSize: '14px', color: '#e8ebed', lineHeight: '1.6', maxWidth: '460px', margin: '0 0 18px' } },
              'The name, photo, email and phone you set here feed the business card. The card itself is designed, previewed, printed and downloaded in the layout tool.'
            ),
            h(
              'a',
              {
                href: '/admin/card-layout.html',
                target: '_blank',
                rel: 'noopener',
                style: {
                  textDecoration: 'none',
                  display: 'inline-flex',
                  alignItems: 'center',
                  fontFamily: "'Space Grotesk',sans-serif",
                  fontSize: '13px',
                  fontWeight: 500,
                  borderRadius: '8px',
                  border: '2px solid #39ff88',
                  background: '#14171a',
                  color: '#39ff88',
                  padding: '9px 14px'
                }
              },
              'Open the card layout tool →'
            ),
            h(
              'p',
              { style: { fontFamily: "'JetBrains Mono',monospace", fontSize: '11px', color: '#8b969c', lineHeight: '1.6', maxWidth: '460px', marginTop: '14px' } },
              'Remember to Publish here first if you changed anything above — the layout tool reads the published values.'
            )
          );
        }
      });

      CMS.registerPreviewTemplate('profile', CardPreview);
    </script>
  </body>
</html>
