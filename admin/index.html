<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Steve's Builds — Admin</title>
    <link rel="stylesheet" href="business-card.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <!-- Hidden, off-screen business-card element used ONLY for printing and
         PNG/JPG export. It lives here in the top-level admin page (not
         inside the CMS preview iframe below) because that iframe is
         sandboxed by Sveltia CMS and blocks canvas image capture / print —
         doing the actual work up here, in the real page origin, avoids that
         entirely. The preview iframe just asks this page to do the work via
         postMessage. See the next script block for the listener. -->
    <div id="card-export-wrap" style="position:fixed;left:-99999px;top:0;" aria-hidden="true">
      <div id="card-export" class="biz-card card-bleed"></div>
    </div>

    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      // --- Top-level page: handles postMessage requests from the preview
      // iframe's business-card component (print / download PNG / download
      // JPG). Runs here, not inside the sandboxed iframe, so html2canvas,
      // window.print(), and file downloads all work normally.
      (function () {
        var exportEl = document.getElementById('card-export');

        function respond(source, type, extra) {
          if (!source) return;
          var msg = Object.assign({ type: type }, extra || {});
          try { source.postMessage(msg, '*'); } catch (err) { console.error('[business-card] failed to postMessage response', err); }
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (!data || typeof data !== 'object' || typeof data.type !== 'string' || data.type.indexOf('sml-card-') !== 0) return;

          exportEl.innerHTML = data.html || '';

          if (data.type === 'sml-card-print') {
            try {
              window.print();
              respond(event.source, 'sml-card-print-done');
            } catch (err) {
              console.error('[business-card] print failed', err);
              respond(event.source, 'sml-card-print-error', { message: String(err && err.message ? err.message : err) });
            }
            return;
          }

          if (data.type === 'sml-card-download') {
            var format = data.format === 'jpg' ? 'jpg' : 'png';
            if (typeof html2canvas !== 'function') {
              console.error('[business-card] html2canvas is not loaded');
              respond(event.source, 'sml-card-download-error', { message: 'html2canvas failed to load — check your internet connection and try again.' });
              return;
            }
            html2canvas(exportEl, { scale: 6.25, backgroundColor: '#0b0d0f', useCORS: true }).then(function (canvas) {
              var mime = format === 'png' ? 'image/png' : 'image/jpeg';
              var quality = format === 'png' ? undefined : 0.95;
              canvas.toBlob(function (blob) {
                if (!blob) {
                  console.error('[business-card] canvas.toBlob returned no blob');
                  respond(event.source, 'sml-card-download-error', { message: 'Could not generate the image file.' });
                  return;
                }
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'strange-machine-labs-business-card.' + format;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                respond(event.source, 'sml-card-download-done', { format: format });
              }, mime, quality);
            }).catch(function (err) {
              console.error('[business-card] html2canvas failed', err);
              respond(event.source, 'sml-card-download-error', { message: String(err && err.message ? err.message : err) });
            });
          }
        });
      })();
    </script>

    <script>
      // --- CMS preview pane: live business-card preview inside the
      // 'Contact info' editor, with Print/Download buttons that hand off
      // the actual work to the top-level page above via postMessage (see
      // the previous <script> block) since this preview renders inside a
      // sandboxed iframe that can't reliably do canvas capture or print
      // itself. Shares admin/business-card.css (registered below) with the
      // standalone admin/business-card.html print page so both stay in sync.
      // Register the Google Fonts stylesheet as its own preview style
      // (not just relying on the @import at the top of business-card.css) --
      // Sveltia's preview pane doesn't always resolve a nested @import the

      // silently fail to load here and fall back to a wider system monospace
      // font, causing the website-URL line to wrap only in this preview even
      // though the live site and print/export (which both use a real <link>)
      // rendered fine.
      CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
      CMS.registerPreviewStyle('/admin/business-card.css');

      function buildCardInnerHtml(name, photoUrl, email, phone){
        var photo = photoUrl
          ? '<img class="biz-card-photo" src="' + photoUrl + '" alt="">'
          : '<div class="biz-card-photo"></div>';

        var firstSpace = (name || '').indexOf(' ');
        var nameHtml = firstSpace === -1
          ? (name || '')
          : name.slice(0, firstSpace) + '<br>' + name.slice(firstSpace + 1);

        var rows = [];
        if (email) rows.push('<a class="biz-card-row" href="mailto:' + email + '">' + mailIcon + '<span>' + email + '</span></a>');
        if (phone) rows.push('<a class="biz-card-row" href="tel:' + phone.replace(/[^+\d]/g, '') + '">' + phoneIcon + '<span>' + phone + '</span></a>');
        rows.push('<a class="biz-card-row" href="https://strangemachinelabs.com" target="_blank" rel="noopener">' + globeIcon + '<span>strangemachinelabs.com</span></a>');

        return (
          '<div class="biz-card-top">' +
            '<div class="biz-card-name">' + nameHtml + '</div>' +
            photo +
            '<div class="biz-card-contact">' + rows.join('') + '</div>' +
          '</div>' +
          '<div class="biz-card-bottom">' +
            '<img class="biz-card-logo" src="https://strangemachinelabs.com/images/logo-strange-machine-card.png" alt="Strange Machine Labs">' +
            '<div class="biz-card-qr">' + QR_SVG + '</div>' +
          '</div>'
        );
      }

      function cardBtnStyle(primary, disabled){
        return {
          fontFamily: "'Space Grotesk',sans-serif",
          fontSize: '13px',
          fontWeight: 500,
          borderRadius: '8px',
          border: '2px solid ' + (primary ? '#39ff88' : '#2a3136'),
          background: '#14171a',
          color: primary ? '#39ff88' : '#e8ebed',
          padding: '9px 14px',
          cursor: disabled ? 'default' : 'pointer',
          opacity: disabled ? 0.5 : 1
        };
      }

      var CardPreview = createClass({
        getInitialState: function () {
          return { busy: false, status: '' };
        },
        componentDidMount: function () {
          var self = this;
          this._onMessage = function (event) {
            var data = event.data;
            if (!data || typeof data !== 'object' || typeof data.type !== 'string' || data.type.indexOf('sml-card-') !== 0) return;
            if (data.type === 'sml-card-print-done') {
              self.setState({ busy: false, status: '' });
            } else if (data.type === 'sml-card-print-error') {
              self.setState({ busy: false, status: 'Print failed: ' + (data.message || 'unknown error') });
            } else if (data.type === 'sml-card-download-done') {
              self.setState({ busy: false, status: (data.format || '').toUpperCase() + ' downloaded — check your downloads folder.' });
            } else if (data.type === 'sml-card-download-error') {
              self.setState({ busy: false, status: 'Could not generate the image: ' + (data.message || 'unknown error') });
            }
          };
          this.props.window.addEventListener('message', this._onMessage);
        },
        componentWillUnmount: function () {
          if (this._onMessage) this.props.window.removeEventListener('message', this._onMessage);
        },
        sendToParent: function (type, extra) {
          if (this.state.busy) return;
          this.setState({ busy: true, status: type === 'sml-card-print' ? 'Opening print dialog…' : 'Rendering…' });
          var msg = Object.assign({ type: type, html: this._innerHtml }, extra || {});
          try {
            this.props.window.parent.postMessage(msg, '*');
          } catch (err) {
            this.setState({ busy: false, status: 'Could not reach the admin page: ' + (err && err.message ? err.message : err) });
          }
        },
        handlePrint: function () {
          this.sendToParent('sml-card-print');
        },
        handleDownload: function (format) {
          this.sendToParent('sml-card-download', { format: format });
        },
        render: function () {
          var entry = this.props.entry;
          var name = entry.getIn(['data', 'name']) || '';
          var photoPath = entry.getIn(['data', 'photoUrl']) || '';
          var email = entry.getIn(['data', 'email']) || '';
          var phone = entry.getIn(['data', 'phone']) || '';
          var photoAsset = photoPath ? this.props.getAsset(photoPath) : null;
          var photoUrl = photoAsset ? photoAsset.url : '';

          var innerHtml = buildCardInnerHtml(name, photoUrl, email, phone);
          this._innerHtml = innerHtml;

          return h(
            'div',
            { style: { padding: '24px', background: '#0b0d0f', minHeight: '100%', boxSizing: 'border-box' } },
            h('div', { className: 'biz-card', dangerouslySetInnerHTML: { __html: innerHtml } }),
            h(
              'div',
              { style: { display: 'flex', gap: '10px', marginTop: '18px', flexWrap: 'wrap' } },
              h('button', { disabled: this.state.busy, onClick: this.handlePrint, style: cardBtnStyle(true, this.state.busy) }, 'Print / Save as PDF'),
              h('button', { disabled: this.state.busy, onClick: this.handleDownload.bind(this, 'png'), style: cardBtnStyle(false, this.state.busy) }, 'Download PNG'),
              h('button', { disabled: this.state.busy, onClick: this.handleDownload.bind(this, 'jpg'), style: cardBtnStyle(false, this.state.busy) }, 'Download JPG')
            ),
            h(
              'p',
              { style: { fontFamily: "'JetBrains Mono',monospace", fontSize: '11px', color: this.state.status.indexOf('failed') > -1 || this.state.status.indexOf('Could not') > -1 ? '#ff6a3d' : '#8b969c', lineHeight: '1.6', maxWidth: '560px', marginTop: '12px' } },
              this.state.status || 'Walgreens-ready 3.625" × 2.125" bleed design (trims to 3.5" × 2"). Print/Save as PDF, or download a 600 DPI PNG/JPG to upload directly — no need to leave this page.'
            )
          );
        }
      });

      CMS.registerPreviewTemplate('profile', CardPreview);
    </script>
