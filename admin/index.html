="27" width="1" height="1"/><rect x="19" y="27" width="1" height="1"/><rect x="20" y="27" width="1" height="1"/><rect x="21" y="27" width="1" height="1"/><rect x="23" y="27" width="1" height="1"/><rect x="25" y="27" width="1" height="1"/><rect x="27" y="27" width="1" height="1"/><rect x="28" y="27" width="1" height="1"/><rect x="29" y="27" width="1" height="1"/><rect x="2" y="28" width="1" height="1"/><rect x="4" y="28" width="1" height="1"/><rect x="5" y="28" width="1" height="1"/><rect x="6" y="28" width="1" height="1"/><rect x="8" y="28" width="1" height="1"/><rect x="13" y="28" width="1" height="1"/><rect x="15" y="28" width="1" height="1"/><rect x="16" y="28" width="1" height="1"/><rect x="17" y="28" width="1" height="1"/><rect x="18" y="28" width="1" height="1"/><rect x="19" y="28" width="1" height="1"/><rect x="23" y="28" width="1" height="1"/><rect x="24" y="28" width="1" height="1"/><rect x="25" y="28" width="1" height="1"/><rect x="26" y="28" width="1" height="1"/><rect x="27" y="28" width="1" height="1"/><rect x="28" y="28" width="1" height="1"/><rect x="29" y="28" width="1" height="1"/><rect x="2" y="29" width="1" height="1"/><rect x="8" y="29" width="1" height="1"/><rect x="12" y="29" width="1" height="1"/><rect x="15" y="29" width="1" height="1"/><rect x="23" y="29" width="1" height="1"/><rect x="25" y="29" width="1" height="1"/><rect x="27" y="29" width="1" height="1"/><rect x="28" y="29" width="1" height="1"/><rect x="30" y="29" width="1" height="1"/><rect x="2" y="30" width="1" height="1"/><rect x="3" y="30" width="1" height="1"/><rect x="4" y="30" width="1" height="1"/><rect x="5" y="30" width="1" height="1"/><rect x="6" y="30" width="1" height="1"/><rect x="7" y="30" width="1" height="1"/><rect x="8" y="30" width="1" height="1"/><rect x="10" y="30" width="1" height="1"/><rect x="12" y="30" width="1" height="1"/><rect x="13" y="30" width="1" height="1"/><rect x="15" y="30" width="1" height="1"/><rect x="16" y="30" width="1" height="1"/><rect x="19" y="30" width="1" height="1"/><rect x="21" y="30" width="1" height="1"/><rect x="26" y="30" width="1" height="1"/><rect x="27" y="30" width="1" height="1"/><rect x="28" y="30" width="1" height="1"/></g></svg>';

      // Reads card-layout.json (small {dx,dy,scale} nudges per element, in %
      // of card width, set by the drag tool at admin/card-layout.html) and
      // caches it. Every place that builds card HTML shares this so a
      // saved nudge shows up everywhere -- site, this CMS preview, and
      // print/export -- without needing per-tier code.
      var _cardLayoutCache = null;
      var _cardLayoutPromise = null;
      function fetchCardLayout(){
        if (_cardLayoutPromise) return _cardLayoutPromise;
        _cardLayoutPromise = fetch('/card-layout.json')
          .then(function (r) { return r.ok ? r.json() : {}; })
          .catch(function () { return {}; })
          .then(function (data) { _cardLayoutCache = data || {}; return _cardLayoutCache; });
        return _cardLayoutPromise;
      }
      function layoutStyleAttr(layout, key){
        var o = layout && layout[key];
        var dx = (o && typeof o.dx === 'number') ? o.dx : 0;
        var dy = (o && typeof o.dy === 'number') ? o.dy : 0;
        var scale = (o && typeof o.scale === 'number') ? o.scale : 1;
        if (!dx && !dy && scale === 1) return '';
        return ' style="--dx:' + dx + ';--dy:' + dy + ';--scale:' + scale + '"';
      }

      function buildCardInnerHtml(name, photoUrl, email, phone, layout){
        layout = layout || {};
        var photo = photoUrl
          ? '<img class="biz-card-photo" src="' + photoUrl + '" alt=""' + layoutStyleAttr(layout, 'photo') + '>'
          : '<div class="biz-card-photo"' + layoutStyleAttr(layout, 'photo') + '></div>';

        var firstSpace = (name || '').indexOf(' ');
        var nameHtml = firstSpace === -1
          ? (name || '')
          : name.slice(0, firstSpace) + '<br>' + name.slice(firstSpace + 1);

        var rows = [];
        if (email) rows.push('<a class="biz-card-row" href="mailto:' + email + '">' + mailIcon + '<span>' + email + '</span></a>');
        if (phone) rows.push('<a class="biz-card-row" href="tel:' + phone.replace(/[^+\d]/g, '') + '">' + phoneIcon + '<span>' + phone + '</span></a>');
        rows.push('<a class="biz-card-row" href="https://strangemachinelabs.com" target="_blank" rel="noopener">' + globeIcon + '<span>strangemachinelabs.com</span></a>');

        return (
          '<div class="biz-card-top">' +
            '<div class="biz-card-name"' + layoutStyleAttr(layout, 'name') + '>' + nameHtml + '</div>' +
            photo +
            '<div class="biz-card-contact"' + layoutStyleAttr(layout, 'contact') + '>' + rows.join('') + '</div>' +
          '</div>' +
          '<div class="biz-card-bottom">' +
            '<img class="biz-card-logo" src="https://strangemachinelabs.com/images/logo-strange-machine-card.png" alt="Strange Machine Labs"' + layoutStyleAttr(layout, 'logo') + '>' +
            '<div class="biz-card-qr"' + layoutStyleAttr(layout, 'qr') + '>' + QR_SVG + '</div>' +
          '</div>'
        );
      }

      var CardPreview = createClass({
        getInitialState: function () {
          return { ready: !!_cardLayoutCache };
        },
        componentDidMount: function () {
          var self = this;
          this._mounted = true;
          if (!_cardLayoutCache) {
            fetchCardLayout().then(function () {
              // setState (not forceUpdate) -- render() below branches on
              // this.state.ready so the card only ever paints once
              // card-layout.json has actually loaded.
              if (self._mounted) self.setState({ ready: true });
            });
          }
        },
        componentWillUnmount: function () {
          this._mounted = false;
        },
        render: function () {
          var entry = this.props.entry;
          var name = entry.getIn(['data', 'name']) || '';
          var photoPath = entry.getIn(['data', 'photoUrl']) || '';
          var email = entry.getIn(['data', 'email']) || '';
          var phone = entry.getIn(['data', 'phone']) || '';
          var photoAsset = photoPath ? this.props.getAsset(photoPath) : null;
          var photoUrl = photoAsset ? photoAsset.url : '';

          var wrapperStyle = { padding: '32px 24px', background: '#0b0d0f', minHeight: '100%', boxSizing: 'border-box' };

          if (!this.state.ready) {
            // React always commits this component's first render before
            // componentDidMount runs, and card-layout.json (the saved
            // --dx/--dy/--scale nudges) only finishes loading after
            // that, asynchronously. Rendering the card on that first
            // pass used to mean it painted once at its unscaled default
            // (every CSS var() falls back to scale:1/dx:0/dy:0 with no
            // saved layout applied yet), then jumped a moment later to
            // Steve's actual saved scale (up to 1.9x) once the fetch
            // resolved -- a visible "pop" on every single reload/entry
            // switch that read as the preview scaling wrong. Showing a
            // plain loading line instead of the card until the real
            // layout is known means the first frame the user actually
            // sees here is already correct -- no intermediate wrong-
            // scaled paint.
            return h('div', { style: wrapperStyle },
              h('p', { style: { fontFamily: "'JetBrains Mono',monospace", fontSize: '12px', color: '#8b969c' } }, 'Loading preview…')
            );
          }

          var innerHtml = buildCardInnerHtml(name, photoUrl, email, phone, _cardLayoutCache);

          return h(
            'div',
            wrapperStyle,
            // Traced the actual cause (not guessing this time): compared
            // computed scrollWidth/clientWidth on every contact row
            // between this preview and the live site -- nothing is
            // being text-clipped internally, scrollWidth === clientWidth
            // everywhere, identical on both. Steve's saved scale values
            // (name 1.9x, contact 1.3x, etc.) genuinely paint content
            // past the card's own edge on every surface -- CSS
            // transform:scale doesn't reserve extra layout room for the
            // bigger visual size. The site and the layout tool have wide
            // open surrounding space for that overflow to spill into
            // unnoticed; whatever fixed-width container Sveltia mounts
            // this preview in does not, so the exact same overflow reads
            // as text getting cut off. zoom (not transform) shrinks the
            // card and everything it paints -- including that overflow
            // -- together, and unlike transform it also shrinks the
            // layout space reserved for it, so there's no gap to
            // compensate for. Confirmed via direct measurement this
            // reduces the overflow amount by the same ~22% as the zoom
            // factor (e.g. 52px of overflow contact-row-vs-card-edge
            // become ~41px at zoom 0.78); dropped to 0.7 here for extra
            // margin since the exact width Sveltia gives this preview
            // isn't something this code can see or control.
            h('div', { className: 'biz-card', style: { zoom: 0.7 }, dangerouslySetInnerHTML: { __html: innerHtml } }),
            h(
              'div',
              { style: { marginTop: '18px' } },
              h(
                'a',
                {
                  href: '/admin/card-layout.html',
                  target: '_blank',
                  rel: 'noopener',
                  style: {
                    textDecoration: 'none',
                    display: 'inline-flex',
                    alignItems: 'center',
                    fontFamily: "'Space Grotesk',sans-serif",
                    fontSize: '13px',
                    fontWeight: 500,
                    borderRadius: '8px',
                    border: '2px solid #39ff88',
                    background: '#14171a',
                    color: '#39ff88',
                    padding: '9px 14px'
                  }
                },
                'Adjust Layout, Print, or Download →'
              )
            ),
            h(
              'p',
              { style: { fontFamily: "'JetBrains Mono',monospace", fontSize: '11px', color: '#8b969c', lineHeight: '1.6', maxWidth: '560px', marginTop: '12px' } },
              'This mirrors the live site exactly. To reposition anything, print, or download a PNG/JPG, use the layout tool above.'
            )
          );
        }
      });

      CMS.registerPreviewTemplate('profile', CardPreview);
    </script>
