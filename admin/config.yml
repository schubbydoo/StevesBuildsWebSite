# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: schubbydoo/StevesBuildsWebSite
  branch: main

media_folder: admin/uploads
public_folder: /admin/uploads

collections:
  - name: "projects"
    label: "Homepage projects"
    files:
      - name: "projects"
        label: "Project list"
        file: "projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            label_singular: "Project"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "blurb", widget: "text" }
              - { label: "YouTube video URL", name: "videoUrl", widget: "string", required: false, hint: "Paste the full link, e.g. https://www.youtube.com/watch?v=CFMEgACaiTo. Leave blank if there's no video." }
              - { label: "Cover image URL", name: "imageUrl", widget: "string", required: false, hint: "Optional. If set, this image is used as the project's thumbnail instead of the YouTube thumbnail — clicking still plays the video if a video ID is set above. Paste any image link (e.g. right-click a photo online and 'Copy image address')." }
              - { label: "External link URL", name: "linkUrl", widget: "string", required: false, hint: "Optional, e.g. a product page or the book's Amazon link." }
              - { label: "External link label", name: "linkLabel", widget: "string", required: false, hint: "Text shown for the link above. Only used if a link URL is set." }
