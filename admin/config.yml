# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: schubbydoo/StevesBuildsWebSite
  branch: main

media_folder: admin/uploads
public_folder: /admin/uploads

collections:
  - name: "profile"
    label: "Contact info"
    files:
      - name: "profile"
        label: "Contact info"
        file: "profile.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Photo", name: "photoUrl", widget: "image", required: false, hint: "Shown at the top of the site." }
          - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Social links"
            name: "socials"
            widget: "list"
            required: false
            label_singular: "Social link"
            summary: "{{label}}"
            hint: "Optional. Add one entry per platform (Instagram, YouTube, etc.) — leave empty if you don't have any yet."
            fields:
              - { label: "Platform name", name: "label", widget: "string", hint: "e.g. Instagram, YouTube, Facebook" }
              - { label: "URL", name: "url", widget: "string" }

  - name: "projects"
    label: "Homepage projects"
    files:
      - name: "projects"
        label: "Project list"
        file: "projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            label_singular: "Project"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "blurb", widget: "text" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                required: false
                field: { label: "Category", name: "category", widget: "string" }
                hint: "Tags like Animatronics, Video, Audio, Interactive, AI, Writing. These build the jump-to index at the top of the site — type a new word here any time to create a new category automatically."
              - { label: "YouTube video URL", name: "videoUrl", widget: "string", required: false, hint: "Paste the full link, e.g. https://www.youtube.com/watch?v=CFMEgACaiTo. Leave blank if there's no video." }
              - { label: "Cover image", name: "imageUrl", widget: "image", required: false, hint: "Optional. Upload a photo to use as this project's thumbnail — overrides the YouTube thumbnail when set, and clicking still plays the video if a video URL is set above." }
              - label: "Cover image framing"
                name: "imagePosition"
                widget: "select"
                required: false
                default: "center"
                hint: "The thumbnail crops to a wide rectangle. If the important part of your photo (like a title) gets cut off, change which edge stays in view."
                options:
                  - { label: "Keep top in view", value: "top" }
                  - { label: "Keep center in view", value: "center" }
                  - { label: "Keep bottom in view", value: "bottom" }
              - { label: "External link URL", name: "linkUrl", widget: "string", required: false, hint: "Optional, e.g. a product page or the book's Amazon link." }
              - { label: "External link label", name: "linkLabel", widget: "string", required: false, hint: "Text shown for the link above. Only used if a link URL is set." }
