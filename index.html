<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strange Machine Labs</title>
<meta name="description" content="Strange Machine Labs — animatronics, AI props, and happy surprises built by Steve Schubert, one bad idea at a time.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d0f;
    --panel:#14171a;
    --line:#2a3136;
    --text:#e8ebed;
    --muted:#8b969c;
    --accent:#39ff88;
    --accent2:#ff6a3d;
    --accent3:#4d8dff;
    --content-max:1600px;
    --content-pad:clamp(24px, 4vw, 64px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:40px 40px;
    background-attachment:fixed;
  }
  a{color:inherit;}
  header{
    padding:80px var(--content-pad) 60px;
    max-width:var(--content-max);
    margin:0 auto;
  }
  .tag{
    font-family:'JetBrains Mono',monospace;
    color:var(--accent);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    display:inline-block;
    border:2px solid var(--accent);
    padding:4px 12px;
    border-radius:6px;
    margin-bottom:24px;
    box-shadow:4px 4px 0 var(--accent);
  }
  h1{
    font-size:clamp(36px,6vw,64px);
    font-weight:700;
    line-height:1.05;
    margin-bottom:20px;
  }
  h1 span{color:var(--accent);}
  .sub{
    color:var(--muted);
    font-size:18px;
    max-width:560px;
    line-height:1.6;
  }
  main{
    max-width:var(--content-max);
    margin:0 auto;
    padding:0 var(--content-pad) 100px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
  }
  .card{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:7px 7px 0 var(--line);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    cursor:pointer;
    display:block;
    text-decoration:none;
  }
  .card:nth-child(3n+1):hover{ border-color:var(--accent); box-shadow:9px 9px 0 var(--accent); }
  .card:nth-child(3n+2):hover{ border-color:var(--accent2); box-shadow:9px 9px 0 var(--accent2); }
  .card:nth-child(3n+3):hover{ border-color:var(--accent3); box-shadow:9px 9px 0 var(--accent3); }
  .card:hover{
    transform:translate(-4px,-4px);
  }
  .thumb-wrap{
    position:relative;
    border-bottom:2px solid var(--line);
    background:#0e1113;
  }
  .thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    filter:saturate(0.85) contrast(1.05);
  }
  .no-video{
    width:100%;
    aspect-ratio:16/9;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--muted);
    background:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:20px 20px;
  }
  .no-video svg{width:28px;height:28px;stroke:var(--muted);}
  .no-video span{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:70px 5vw 5vw;
  }
  .modal-backdrop.open{display:flex;}
  .modal-box{
    position:relative;
    width:100%;
    max-width:960px;
  }
  .modal-video-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:2px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:7px 7px 0 var(--accent);
  }
  .coming-soon{
    display:none;
    position:absolute;
    inset:0;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:20px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .coming-soon svg{width:40px;height:40px;stroke:var(--accent);}
  .coming-soon .cs-title{
    font-size:20px;
    font-weight:500;
    max-width:480px;
  }
  .coming-soon .cs-label{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
  }
  .modal-video-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  .modal-close{
    position:absolute;
    top:-48px;
    right:0;
    background:var(--panel);
    border:2px solid var(--line);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    width:38px;
    height:38px;
    border-radius:8px;
    cursor:pointer;
    line-height:1;
  }
  .modal-close:hover{border-color:var(--accent);color:var(--accent);}
  .stamp{
    position:absolute;
    top:10px;
    right:10px;
    background:#0b0d0f;
    color:var(--accent);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:4px 9px;
    border-radius:6px;
    border:2px solid var(--accent);
  }
  .card-body{padding:20px 22px 24px;}
  .card-body .num{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent2);
    letter-spacing:1px;
  }
  .card-body h3{
    font-size:19px;
    font-weight:500;
    margin:8px 0 8px;
  }
  .card-body p{
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }
  .card-body .extra-link{
    display:inline-block;
    margin-top:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent3);
    text-decoration:underline;
  }
  .card-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .card-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:5px;
    padding:2px 7px;
  }
  .category-nav{
    max-width:var(--content-max);
    margin:0 auto;
    padding:0 var(--content-pad) 10px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
  }
  .category-nav-label{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-right:4px;
  }
  .category-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text);
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:8px;
    padding:7px 14px;
    cursor:pointer;
  }
  .category-pill:hover{border-color:var(--accent);color:var(--accent);}
  .category-pill.active{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(57,255,136,0.1);
  }
  .clear-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
    background:transparent;
    border:2px dashed var(--line);
    border-radius:8px;
    padding:7px 14px;
    cursor:pointer;
    display:none;
  }
  .clear-pill:hover{border-color:var(--accent2);color:var(--accent2);}
  .card{ transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease, opacity .25s ease; }
  .card.tag-match{
    border-color:var(--accent) !important;
    box-shadow:7px 7px 0 var(--accent) !important;
  }
  .card.tag-dim{ opacity:0.3; }
  @keyframes card-pulse{
    0%, 100%{ box-shadow:7px 7px 0 var(--accent); }
    50%{ box-shadow:12px 12px 0 var(--accent); }
  }
  .card.tag-match-pulse{ animation:card-pulse 0.5s ease-in-out 2; }
  .empty{
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
  }
  footer{
    text-align:center;
    padding:40px;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    border-top:1px solid var(--line);
  }
  .profile-bar{
    max-width:var(--content-max);
    margin:0 auto;
    padding:24px var(--content-pad) 0;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .profile-photo{
    width:73px;
    height:73px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
  }
  .profile-info{display:flex;flex-direction:column;gap:8px;}
  .profile-name{font-size:15px;font-weight:500;}
  .profile-socials{
    display:flex;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
  }
  .contact-icon{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    text-decoration:none;
    color:var(--text);
  }
  .contact-icon-circle{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    flex-shrink:0;
  }
  .contact-icon-circle svg{width:18px;height:18px;}
  .contact-icon:hover .contact-icon-circle{border-color:var(--accent);color:var(--accent);}
  .contact-icon-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }
  .contact-icon:hover .contact-icon-label{color:var(--accent);}
  .social-placeholder{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px dashed var(--line);
  }
</style>
</head>
<body>
<div class="profile-bar" id="profile-bar"></div>
<header>
  <span class="tag" id="hero-tag">retired, wired, and inspired</span>
  <h1 id="hero-headline">Strange <span>Machine</span> Labs</h1>
  <p class="sub" id="hero-subtitle">Animatronics, AI props, and happy surprises — some assembly required, one bad idea at a time.</p>
</header>
<nav class="category-nav" id="category-nav"></nav>
<main>
  <div class="grid" id="project-grid">
    <p class="empty">Loading projects…</p>
  </div>
</main>
<footer>STEVE SCHUBERT · SHSCHUBERT@GMAIL.COM</footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-video-wrap">
      <iframe id="modal-iframe" src="" title="Project video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      <div class="coming-soon" id="modal-coming-soon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 3.5"/></svg>
        <div class="cs-title" id="coming-soon-title"></div>
        <div class="cs-label">coming soon</div>
      </div>
    </div>
  </div>
</div>

<script>
  fetch('hero.json')
    .then(res => res.json())
    .then(hero => {
      if (hero.tag) document.getElementById('hero-tag').innerHTML = hero.tag;
      if (hero.headline) document.getElementById('hero-headline').innerHTML = hero.headline;
      if (hero.subtitle) document.getElementById('hero-subtitle').innerHTML = hero.subtitle;
    })
    .catch(() => {});

  fetch('profile.json')
    .then(res => res.json())
    .then(renderProfile)
    .catch(() => {});

  const mailIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>`;

  const SOCIAL_META = {
    instagram: {
      label: 'Instagram',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.7" fill="currentColor" stroke="none"/></svg>`
    },
    facebook: {
      label: 'Facebook',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M14 8.3h-1.3c-.7 0-1.2.5-1.2 1.3v1.9H14l-.3 2H11.5V19H9.3v-5.5H8v-2h1.3V9.6c0-1.7 1.1-3 2.9-3H14v1.7z" fill="currentColor" stroke="none"/></svg>`
    },
    youtube: {
      label: 'YouTube',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10.5 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></svg>`
    },
    tiktok: {
      label: 'TikTok',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v10.6a3 3 0 1 1-2-2.9"/><path d="M13 4c.5 2.5 2.4 4.1 5 4.3"/></svg>`
    },
    twitter: {
      label: 'X (Twitter)',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14"/><path d="M19 5L5 19"/></svg>`
    },
    linkedin: {
      label: 'LinkedIn',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 10.5V17M7.5 7.5v.01M11 17v-4a2 2 0 0 1 4 0v4M11 13v4"/></svg>`
    }
  };

  function renderProfile(profile){
    const bar = document.getElementById('profile-bar');
    const photo = profile.photoUrl
      ? `<img class="profile-photo" src="${profile.photoUrl}" alt="${profile.name || ''}">`
      : '';

    const emailHtml = profile.email
      ? `<a class="contact-icon" href="mailto:${profile.email}" title="Email">
           <span class="contact-icon-circle">${mailIcon}</span>
           <span class="contact-icon-label">${profile.email}</span>
         </a>`
      : '';

    const socials = profile.socials || {};
    const socialIconsHtml = Object.keys(SOCIAL_META)
      .filter(key => socials[key] && socials[key].enabled && socials[key].url)
      .map(key => `<a class="contact-icon" href="${socials[key].url}" target="_blank" rel="noopener" title="${SOCIAL_META[key].label}">
             <span class="contact-icon-circle">${SOCIAL_META[key].icon}</span>
           </a>`)
      .join('');

    const contactHtml = (emailHtml || socialIconsHtml)
      ? emailHtml + socialIconsHtml
      : '<span class="social-placeholder"></span><span class="social-placeholder"></span><span class="social-placeholder"></span>';

    bar.innerHTML = `
      ${photo}
      <div class="profile-info">
        <div class="profile-name">${profile.name || ''}</div>
        <div class="profile-socials">${contactHtml}</div>
      </div>
    `;
  }

  fetch('projects.json')
    .then(res => res.json())
    .then(data => renderProjects(data.projects || []))
    .catch(err => {
      document.getElementById('project-grid').innerHTML =
        '<p class="empty">Couldn\'t load projects.json — ' + err.message + '</p>';
    });

  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalIframe = document.getElementById('modal-iframe');
  const modalClose = document.getElementById('modal-close');
  const modalComingSoon = document.getElementById('modal-coming-soon');
  const comingSoonTitle = document.getElementById('coming-soon-title');

  function openVideoModal(videoId){
    modalComingSoon.style.display = 'none';
    modalIframe.style.display = 'block';
    modalIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    modalBackdrop.classList.add('open');
  }
  function openComingSoonModal(title){
    modalIframe.style.display = 'none';
    modalIframe.src = '';
    comingSoonTitle.textContent = title || '';
    modalComingSoon.style.display = 'flex';
    modalBackdrop.classList.add('open');
  }
  function closeVideoModal(){
    modalBackdrop.classList.remove('open');
    modalIframe.src = '';
    modalIframe.style.display = 'block';
    modalComingSoon.style.display = 'none';
  }
  modalClose.addEventListener('click', closeVideoModal);
  modalBackdrop.addEventListener('click', e => {
    if (e.target === modalBackdrop) closeVideoModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeVideoModal();
  });

  const linkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4L10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>`;
  const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 3.5"/></svg>`;

  function extractYouTubeId(url){
    if (!url) return '';
    const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,15})/);
    return match ? match[1] : '';
  }

  function renderProjects(projects){
    const grid = document.getElementById('project-grid');
    grid.innerHTML = '';

    projects.forEach((p, i) => {
      const num = String(i + 1).padStart(2, '0');
      const videoId = extractYouTubeId(p.videoUrl);
      const href = videoId
        ? p.videoUrl
        : (p.linkUrl || '#');

      const position = ['top', 'bottom'].includes(p.imagePosition) ? p.imagePosition : 'center';

      const thumbHtml = p.imageUrl
        ? `<img class="thumb" style="object-position:${position}" src="${p.imageUrl}" alt="${p.title}">`
        : videoId
        ? `<img class="thumb" src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="${p.title}">`
        : p.linkUrl
        ? `<div class="no-video">${linkIcon}<span>external link</span></div>`
        : `<div class="no-video">${clockIcon}<span>coming soon</span></div>`;

      const extraLinkHtml = (p.linkUrl && videoId)
        ? `<a class="extra-link" href="${p.linkUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${p.linkLabel || 'Learn more'}</a>`
        : '';

      const categories = Array.isArray(p.categories) ? p.categories.filter(Boolean) : [];
      const tagsHtml = categories.length
        ? `<div class="card-tags">${categories.map(c => `<span class="card-tag">${c}</span>`).join('')}</div>`
        : '';

      const card = document.createElement('a');
      card.className = 'card';
      card.href = href;
      card.target = '_blank';
      card.rel = 'noopener';
      card.dataset.categories = categories.join('|');
      card.innerHTML = `
        <div class="thumb-wrap">
          ${thumbHtml}
          <span class="stamp">${num}</span>
        </div>
        <div class="card-body">
          <div class="num">PROJECT ${num}</div>
          <h3>${p.title}</h3>
          <p>${p.blurb}</p>
          ${tagsHtml}
          ${extraLinkHtml}
        </div>
      `;

      if (videoId) {
        card.addEventListener('click', e => {
          e.preventDefault();
          openVideoModal(videoId);
        });
      } else if (!p.linkUrl) {
        card.addEventListener('click', e => {
          e.preventDefault();
          openComingSoonModal(p.title);
        });
      }

      grid.appendChild(card);
    });

    renderCategoryNav(projects);
  }

  let activeCategory = null;

  function renderCategoryNav(projects){
    const nav = document.getElementById('category-nav');
    const seen = new Set();
    projects.forEach(p => (p.categories || []).forEach(c => c && seen.add(c)));
    const categories = Array.from(seen).sort((a, b) => a.localeCompare(b));

    if (!categories.length) { nav.innerHTML = ''; return; }

    nav.innerHTML = `<span class="category-nav-label">Highlight:</span>` +
      categories.map(c => `<button type="button" class="category-pill" data-jump="${c}">${c}</button>`).join('') +
      `<button type="button" class="clear-pill" id="clear-filter">✕ clear</button>`;

    nav.querySelectorAll('.category-pill').forEach(btn => {
      btn.addEventListener('click', () => toggleCategory(btn.dataset.jump));
    });
    document.getElementById('clear-filter').addEventListener('click', clearCategoryFilter);
  }

  function toggleCategory(category){
    if (activeCategory === category) {
      clearCategoryFilter();
      return;
    }
    activeCategory = category;
    const cards = Array.from(document.querySelectorAll('#project-grid .card'));
    let firstMatch = null;

    cards.forEach(card => {
      const cats = card.dataset.categories ? card.dataset.categories.split('|') : [];
      const isMatch = cats.includes(category);
      card.classList.toggle('tag-match', isMatch);
      card.classList.toggle('tag-dim', !isMatch);
      card.classList.remove('tag-match-pulse');
      if (isMatch && !firstMatch) firstMatch = card;
    });

    updatePillStates();

    if (firstMatch) {
      firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
      firstMatch.classList.add('tag-match-pulse');
      setTimeout(() => firstMatch.classList.remove('tag-match-pulse'), 1000);
    }
  }

  function clearCategoryFilter(){
    activeCategory = null;
    document.querySelectorAll('#project-grid .card').forEach(card => {
      card.classList.remove('tag-match', 'tag-dim', 'tag-match-pulse');
    });
    updatePillStates();
  }

  function updatePillStates(){
    document.querySelectorAll('.category-pill').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.jump === activeCategory);
    });
    const clearBtn = document.getElementById('clear-filter');
    if (clearBtn) clearBtn.style.display = activeCategory ? 'inline-flex' : 'none';
  }
</script>
</body>
</html>
